<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>باغ جادویی آیناز</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&family=Lalezar&display=swap" rel="stylesheet">
<style>
:root{--b1:#ffe6f1;--b2:#ece3ff;--card:#fff;--ink:#3b2a5a;--mut:#7a6a99;--teal:#8b6df0;--org:#ff5c9a;--lime:#7fe3c4;--ok:#2fb67c;--bad:#ef5b6b;--line:#f6d3e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--b1:#2a1a45;--b2:#1b1636;--card:#35264f;--ink:#fdf2ff;--mut:#c4b3e0;--line:#4d3a70}}
:root[data-theme="dark"]{--b1:#2a1a45;--b2:#1b1636;--card:#35264f;--ink:#fdf2ff;--mut:#c4b3e0;--line:#4d3a70}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:linear-gradient(180deg,var(--b1),var(--b2)) fixed;color:var(--ink);font-family:"Vazirmatn",Tahoma,sans-serif;line-height:1.8;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 12% 18%,#fffa 0 3px,transparent 4px),radial-gradient(circle at 82% 10%,#fffa 0 4px,transparent 5px),radial-gradient(circle at 30% 72%,#fff9 0 3px,transparent 4px),radial-gradient(circle at 90% 60%,#fffa 0 3px,transparent 4px),radial-gradient(circle at 58% 92%,#fff9 0 4px,transparent 5px)}
#app{max-width:460px;margin:0 auto;padding:14px;position:relative}
h1,h2{font-family:"Lalezar","Vazirmatn",sans-serif;font-weight:400;color:var(--org)}
h1{font-size:34px;margin:4px 0;text-align:center;line-height:1.4}
h2{font-size:23px;margin:10px 0;color:var(--ink)}
p{margin:6px 0}.mut{color:var(--mut)}
.card{background:var(--card);border:3px solid var(--line);border-radius:26px;padding:14px;margin:12px 0;box-shadow:0 6px 18px #a46bd822}
.center{text-align:center}
.say{display:flex;align-items:center;gap:12px;margin:6px 0 10px}
.fy{width:68px;height:68px;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 0 0 3px var(--org),0 6px 14px #ff5c9a44;animation:bob 2.6s ease-in-out infinite;flex:none}
.hero{display:block;width:210px;max-width:70%;margin:6px auto;border-radius:32px;border:5px solid #fff;box-shadow:0 0 0 4px var(--org),0 10px 24px #ff5c9a55}
.hero.sm{width:140px}
.bub{position:relative;background:var(--card);border:3px solid var(--line);border-radius:20px;padding:8px 14px;font-weight:700;flex:1}
.bub::before{content:"";position:absolute;right:-15px;top:50%;margin-top:-8px;border:8px solid transparent;border-left-color:var(--line)}
@keyframes bob{50%{transform:translateY(-6px) rotate(-4deg)}}
.garden{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;font-size:22px;background:var(--card);border:3px solid var(--line);border-radius:22px;padding:8px;margin:8px 0}
.lv{display:flex;gap:12px;align-items:center;width:100%;text-align:right;font:inherit;color:inherit;background:var(--card);border:3px solid var(--line);border-radius:24px;padding:12px;margin:10px 0;cursor:pointer;box-shadow:0 5px 0 var(--line)}
.lv:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.lv:disabled{opacity:.55;cursor:default}
.lv .ic{font-size:30px;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;flex:none;box-shadow:inset 0 -4px 0 #0002}
.lv b{display:block;font-size:17px}.lv small{color:var(--mut)}
.top{display:flex;align-items:center;margin-bottom:4px}
.ghost{background:var(--card);border:3px solid var(--line);border-radius:16px;font-size:20px;padding:2px 12px;cursor:pointer;color:inherit}
.bar{flex:1;height:14px;background:var(--line);border-radius:8px;margin:0 10px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff9ac4,#ff5c9a);border-radius:8px;transition:width .3s}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}
.opts.w{grid-template-columns:1fr}
.opt,.btn{font:inherit;font-weight:900;font-size:22px;border:none;border-radius:20px;padding:12px 6px;cursor:pointer;color:#fff;background:linear-gradient(180deg,#b9a0ff,#8b6df0);box-shadow:0 5px 0 #6b4fd0}
.opt:active,.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #6b4fd0}
.btn{font-size:18px;padding:10px 20px;background:linear-gradient(180deg,#ff9ac4,#ff5c9a);box-shadow:0 5px 0 #d63d7a;margin:6px 4px}
.btn.alt{background:linear-gradient(180deg,#9ceed3,#4fd0aa);color:#1d3b33;box-shadow:0 5px 0 #38a888}
.opt.ok{background:linear-gradient(180deg,#6fe0a8,#2fb67c);box-shadow:0 5px 0 #1f8a5d}
.opt.bad{background:linear-gradient(180deg,#ff8f9c,#ef5b6b);box-shadow:0 5px 0 #b83d4b;animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{min-height:70px;text-align:center;font-weight:700}
.big{font-size:32px;text-align:center;min-height:44px}
.seq,.mach{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin:14px 0}
.ch{display:inline-grid;place-items:center;min-width:48px;height:48px;padding:0 8px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#cbb8ff,#8b6df0);color:#fff;font-size:21px;font-weight:900;box-shadow:0 3px 0 #6b4fd0}
.ch.q{background:radial-gradient(circle at 30% 25%,#ffb3d1,#ff5c9a);box-shadow:0 3px 0 #d63d7a}
.q{color:var(--org)}
.box{background:linear-gradient(180deg,#a8f0d8,#6ad9b8);color:#1d3b33;padding:8px 12px;border-radius:16px;font-weight:700}
.fl{text-align:center;font-size:30px;line-height:1.35;margin:10px 0}
.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;direction:ltr;width:76px;margin:auto}
.mg i{aspect-ratio:1;background:var(--line);border-radius:5px}.mg i.f{background:var(--org)}
.sym{display:flex;direction:ltr;align-items:center;justify-content:center;gap:10px;margin:12px 0}
.sym .mg{width:120px}.line{height:120px;border-left:3px dashed var(--teal)}
.tip{background:linear-gradient(180deg,#9ceed3,#7fe3c4);color:#1d3b33;border-radius:20px;padding:10px 14px;font-weight:700}
.cf{position:fixed;top:-30px;font-size:26px;pointer-events:none;z-index:9;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.cf{display:none}}
</style>
</head>

  const n=R(2,9);return QN(`هر شکلات ۵۰ ریال سود دارد. فروش ${fa(n)} شکلات چقدر سود دارد؟`,`<div class="big">${'🍬'.repeat(n)}</div>`,n*50,[n*50+50,n*50-50,n*50+100],'۵۰تا ۵۰تا شمردیم')}},
{n:'ماشین جادویی',ic:'🪄',col:'linear-gradient(135deg,#d3c1ff,#a78bfa)',d:'ماشین ورودی و خروجی',
 learn:()=>`<div class="card"><p>ماشین یک عدد می‌گیرد، یک کار روی آن انجام می‌دهد و عدد جدید بیرون می‌دهد.</p>${mach('<span id="mi">؟</span>','۳ تا اضافه می‌کند','<span id="mo">؟</span>')}<p class="center">یک عدد به ماشین بده:</p><div class="opts" style="grid-template-columns:repeat(5,1fr)">${[1,2,3,4,5].map(x=>`<button class="opt" onclick="mc(${x})">${fa(x)}</button>`).join('')}</div></div><div class="tip">برای پیدا کردن کار ماشین، ورودی و خروجی را با هم مقایسه کن.</div>`,
 gen:()=>{const r=RU[R(0,5)];
  if(Math.random()<.5){const x=R(4,9),y=r.f(x);return QN('خروجی ماشین چند می‌شود؟',mach(fa(x),r.t,'؟'),y,[y+1,y-1,x,y+2],'ماشین '+r.t)}
  const x1=R(4,6),x2=R(7,9),o=shuffle(RU.filter(u=>u!==r&&!(u.f(x1)===r.f(x1)&&u.f(x2)===r.f(x2))));
  const q=Q('ماشین چه کاری انجام می‌دهد؟',`<div class="card">${mach(fa(x1),'؟',fa(r.f(x1)))}${mach(fa(x2),'؟',fa(r.f(x2)))}</div>`,r.t,[o[0].t,o[1].t],'قاعده را از دو مثال پیدا کردی');q.w=1;return q}},
{n:'مهمانی چای',ic:'🫖',col:'linear-gradient(135deg,#ffe2a3,#ffc14d)',d:'ساعت بعد از ظهر',
 learn:()=>`<div class="card center"><p>بعد از ظهر، ساعت‌ها بعد از ۱۲ ادامه پیدا می‌کنند: ۱۳، ۱۴، ۱۵ ... یعنی عدد ساعت را با ۱۲ جمع می‌کنیم.</p><div id="cl"></div><div class="big" id="ct"></div><input type="range" min="1" max="11" value="3" oninput="cs(this.value)" style="width:80%"><p class="mut">لغزنده را حرکت بده.</p></div>`,
 init:()=>cs(3),
 gen:()=>{const h=R(1,9),t=R(0,2);
  if(t===0)return QN(`ساعت ${fa(h)} بعدازظهر در ساعت ۲۴ ساعته چه عددی است؟`,'',h+12,[h,h+10,h+2,h+13],`${fa(h)} + ۱۲ = ${fa(h+12)}`);
  if(t===1)return QN(`ساعت ${fa(h+12)}:۰۰ یعنی چه ساعتی بعد از ظهر؟`,'',h,[h+1,h-1,h+2,h+12],`${fa(h+12)} − ۱۲ = ${fa(h)}`);
  const m=R(0,1)*30;return Q('ساعت بعد از ظهر است. در ساعت ۲۴ ساعته چند است؟',`<div class="center">${clock(h,m)}</div>`,tm(h+12,m),[tm(h,m),tm(h+11,m)],'به عدد ساعت ۱۲ تا اضافه کردی')}},
{n:'پروانه‌ی آینه‌ای',ic:'🦋',col:'linear-gradient(135deg,#a9e4ff,#6cc4f5)',d:'الگوهای متقارن',
 learn:()=>{const L=[0,0,1,1,0,1,1,0,1,1,0,0,0,1,1,1];return `<div class="card center"><p>اگر شکل را روی خط وسط تا کنی و دو نیمه روی هم بیفتند، شکل <b>متقارن</b> است. نیمه‌ی راست مثل آینه‌ی نیمه‌ی چپ است.</p><div class="sym"><div>${mg(L)}</div><div class="line"></div><div>${mg(mir(L))}</div></div></div><div class="tip">هر چیزی که در چپ، نزدیک خط است، در راست هم نزدیک خط است.</div>`},
 gen:()=>{let L,M,W;do{L=Array.from({length:16},()=>+(Math.random()<.45));M=mir(L);W=M.slice();W[R(0,15)]^=1}while(L.filter(x=>x).length<5||M.join()===L.join()||W.join()===L.join());
  return Q('کدام نیمه‌ی راست، مثل آینه‌ی نیمه‌ی چپ است؟',`<div class="sym"><div>${mg(L)}</div><div class="line"></div><b class="q" style="font-size:32px">؟</b></div>`,mg(M),[mg(L),mg(W)],'درست! تصویر آینه‌ای است')}}
];
const mc=x=>{$('mi').textContent=fa(x);$('mo').textContent=fa(x+3)};
const cs=v=>{v=+v;$('cl').innerHTML=clock(v,0);$('ct').textContent=`${fa(v)} بعدازظهر = ${fa(v+12)}`};

const PR=['آفرین آیناز جان! ✨','عالی بود آیناز! 💖','چه باهوشی آیناز! 🌸','درست بود آیناز عزیزم! 🎉','ایول آیناز! ادامه بده 🦄'];
const TRY=['اشکالی نداره آیناز جان، دوباره امتحان کن 💗','آیناز، یک بار دیگه خوب نگاه کن 🔍','نزدیک بودی آیناز! دوباره 🌷'];
const pick=a=>a[R(0,a.length-1)];
let SND=true,AC=null;
function tone(f,t,d,ty,v){if(!SND)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain(),s0=AC.currentTime+t;o.type=ty||'triangle';o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(0,s0);g.gain.linearRampToValueAtTime(v||.18,s0+.02);g.gain.exponentialRampToValueAtTime(.001,s0+d);o.start(s0);o.stop(s0+d+.05)}catch(e){}}
const sfx={ok:()=>[523,659,784,1047].forEach((f,i)=>tone(f,i*.09,.28)),bad:()=>{tone(330,0,.2,'sine');tone(247,.17,.3,'sine')},win:()=>[523,659,784,659,784,1047,1319,1568].forEach((f,i)=>tone(f,i*.12,.34))};
const hasFa=()=>{try{return speechSynthesis.getVoices().some(v=>/^fa/i.test(v.lang))}catch(e){return false}};
function speak(t,m){
  if(!SND||!window.speechSynthesis)return;
  if(!hasFa()){if(m&&$('bub'))$('bub').textContent='صدای فارسی روی این گوشی فعال نیست. از تنظیمات گوشی، صدای فارسی را اضافه کن 🔧';return}
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/<[^>]*>/g,' ').replace(/[^\u0600-\u06FF0-9\s؟،.!:+=−×]/g,' '));u.lang='fa-IR';u.rate=.9;u.pitch=1.15;speechSynthesis.speak(u)}catch(e){}
}
function tg(){SND=!SND;if(!SND&&window.speechSynthesis)speechSynthesis.cancel();document.querySelectorAll('.snd').forEach(b=>b.textContent=SND?'🔊':'🔇')}
const sndBtn=()=>`<button class="ghost snd" onclick="tg()">${SND?'🔊':'🔇'}</button>`;
if(window.speechSynthesis)speechSynthesis.getVoices();
const say=t=>`<div class="say"><img class="fy" src="${AV}" alt=""><div class="bub" id="bub">${t}</div></div>`;
function burst(){for(let i=0;i<14;i++){const e=document.createElement('span');e.className='cf';e.textContent=pick(['✨','🌸','💖','⭐','🦋']);e.style.left=R(3,95)+'vw';e.style.animationDelay=(Math.random()*.4)+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),2300)}}
function home(){
  const done=st.slice(0,5).filter(x=>x).length,all=done===5,fl=st.reduce((a,b)=>a+b,0);
  show(`<div class="top"><span style="flex:1"></span>${sndBtn()}</div>`+say(done?'چه باغ قشنگی داری آیناز! ادامه بدیم؟ 🌷':'سلام آیناز جان! من راهنمات هستم. بیا با هم باغ جادویی بسازیم 🌈')+`<img class="hero" src="${HERO}" alt=""><h1>باغ جادویی آیناز</h1><div class="garden">${Array.from({length:18},(_,i)=>i<fl?'🌸':'🌱').join('')}</div><p class="center mut">با هر قلب، یک گل در باغت می‌شکفد</p>`+
  ST.map((x,i)=>{const ok=i===0||st[i-1]>0;return `<button class="lv" ${ok?'':'disabled'} onclick="lesson(${i})"><div class="ic" style="background:${x.col}">${ok?x.ic:'🔒'}</div><div><b>${x.n}</b><small>${x.d}</small><br>${st[i]?'💖'.repeat(st[i]):'🤍🤍🤍'}</div></button>`}).join('')+
  `<button class="lv" ${all?'':'disabled'} onclick="go(5)"><div class="ic" style="background:linear-gradient(135deg,#ffd0a3,#ff9a5c)">${all?'👑':'🔒'}</div><div><b>تاج مرور فصل</b><small>۶ سؤال از همه‌ی درس‌ها</small><br>${st[5]?'💖'.repeat(st[5]):'🤍🤍🤍'}</div></button>`)
}
function lesson(i){show(`<div class="top"><button class="ghost" onclick="home()">🏠</button><span style="flex:1"></span>${sndBtn()}</div>`+say('آیناز جان، اول یاد می‌گیریم، بعد بازی می‌کنیم 🎀')+`<h1>${ST[i].ic} ${ST[i].n}</h1>${ST[i].learn()}<div class="center"><button class="btn" onclick="go(${i})">بریم تمرین! 💪</button><button class="btn alt" onclick="speak(ST[${i}].learn(),1)">🗣️ بخوان برام</button></div>`);if(ST[i].init)ST[i].init()}
function go(i){S=i;qi=0;N=i===5?6:4;mist=0;next()}
function next(){qi++;if(qi>N)return fin();const g=S===5?ST[R(0,4)].gen:ST[S].gen;cur=g();cur.done=0;
  show(`<div class="top"><button class="ghost" onclick="home()">🏠</button><div class="bar"><i style="width:${(qi-1)/N*100}%"></i></div><b>${fa(qi)}/${fa(N)}</b><span style="margin-right:8px">${sndBtn()}</span></div>`+say(`آیناز جان، سؤال ${fa(qi)} از ${fa(N)}؛ تو می‌تونی! 💪`)+`<h2>${cur.t} <button class="ghost" onclick="speak(cur.t,1)">🗣️</button></h2>${cur.b||''}<div class="opts${cur.w?' w':''}">${cur.o.map((x,i)=>`<button class="opt" onclick="ans(${i},this)">${x}</button>`).join('')}</div><div id="fb" class="fb"></div>`);speak(cur.t)}
function ans(i,b){
  if(cur.done)return;
  if(i===cur.a){cur.done=1;b.classList.add('ok');burst();const pr=pick(PR);$('bub').textContent=pr;sfx.ok();speak(pr);$('fb').innerHTML=`${cur.m||''}<br><button class="btn" onclick="next()">${qi<N?'سؤال بعدی':'پایان'}</button>`}
  else{mist++;b.classList.add('bad');b.disabled=true;const tr=pick(TRY);$('bub').textContent=tr;sfx.bad();speak(tr)}
}
function fin(){
  const s=mist===0?3:mist<=2?2:1;st[S]=Math.max(st[S],s);burst();s===3?sfx.win():sfx.ok();
  const nx=S<4?`<button class="btn" onclick="lesson(${S+1})">درس بعدی</button>`:S===4?`<button class="btn" onclick="go(5)">تاج مرور فصل 👑</button>`:'';
  const fm=s===3?'وای آیناز! بی‌نقص بودی! 🌟':'آفرین آیناز جان! یک گل جدید برات شکفت 🌷';speak(fm);show(say(fm)+`<div class="card center"><img class="hero sm" src="${HERO}" alt=""><div class="big">${'💖'.repeat(s)}</div><h2>${S===5&&s===3?'آیناز، تو ملکه‌ی الگوها هستی! 👑':s===3?'عالی بود! بدون اشتباه':'آفرین! تمام شد'}</h2><p class="mut">تعداد اشتباه‌ها: ${fa(mist)}</p>${nx}<button class="btn alt" onclick="${S<5?`lesson(${S})`:'go(5)'}">${S<5?'مرور درس':'دوباره'}</button><button class="btn alt" onclick="home()">منو</button></div>`)
}
home();
</script>
</body>
</html>
